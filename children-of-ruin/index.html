<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Children of Ruin — an anime minute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0a1026;overflow:hidden;color:#fdf8ec;font-family:'Cormorant Garamond',Georgia,serif}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;box-shadow:0 0 80px rgba(0,0,0,.7);cursor:pointer}
  .ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
      background:radial-gradient(ellipse at 50% 40%,rgba(40,70,130,.85),rgba(8,12,32,.97));transition:opacity .6s}
  .ov.hide{opacity:0;pointer-events:none}
  .ov h1{font-weight:500;font-style:italic;font-size:clamp(34px,6vw,72px);margin:0;letter-spacing:.02em}
  .ov p{font-family:'Klee One',cursive;font-size:clamp(16px,2.1vw,22px);margin:0;opacity:.75}
  .btn{font-family:'Klee One',cursive;font-weight:600;font-size:24px;color:#1d2440;background:#fdf8ec;border:none;border-radius:40px;
       padding:10px 36px;cursor:pointer;box-shadow:3px 4px 0 #7fd6c8;transition:transform .15s}
  .btn:hover{transform:translate(-1px,-2px) rotate(-1deg)}
  .ov a{font-family:'Klee One',cursive;font-size:17px;color:#fdf8ec;opacity:.6;text-decoration:none;border-bottom:1px dashed rgba(253,248,236,.5)}
  .ov a:hover{opacity:1}
  #bar{position:fixed;left:0;bottom:0;height:3px;background:#7fd6c8;opacity:.55;width:0}
  #hint{position:fixed;right:14px;bottom:10px;font-family:'Klee One',cursive;font-size:15px;opacity:0;transition:opacity 1s}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="bar"></div>
<div id="hint">space · pause &nbsp; r · restart &nbsp; f · fullscreen</div>
<div class="ov" id="start">
  <h1>Children of Ruin</h1>
  <p>a one-minute anime reverie · sound on</p>
  <button class="btn" id="go">▶ begin</button>
  <a href="../">← book one: Children of Time</a>
</div>
<div class="ov hide" id="end">
  <p>the conversation goes on</p>
  <button class="btn" id="again">↻ again</button>
  <a href="../">← book one: Children of Time</a>
</div>

<script>
/* =====================================================================
   CHILDREN OF RUIN — a one-minute animation in a hand-painted anime style
   Painted skies, towering cumulus, cel-shaded characters with clean
   linework, and a synthesised piano/strings/flute score. Everything is
   procedural canvas + Web Audio.
   ===================================================================== */

const W = 1280, H = 720, DUR = 60, FPS = 24;
const LINE = '#2c2530';

/* ---------------------------------------------------------------- utils */
let g, BF = 0, TT = 0;
const fr = x => x - Math.floor(x);
const nz = k => fr(Math.sin(k * 127.1 + BF * 311.7) * 43758.5453) * 2 - 1;   // flickers on twos
const sn = k => fr(Math.sin(k * 91.7 + 3.1) * 47453.3) * 2 - 1;              // static noise
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const eo = t => 1 - Math.pow(1 - t, 3);
const ei = t => t * t * t;
const bell = t => Math.sin(Math.PI * clamp(t));
const TAU = Math.PI * 2;
const rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function mix(a, b, u) { const A = rgb(a), B = rgb(b); return `rgb(${Math.round(lerp(A[0], B[0], u))},${Math.round(lerp(A[1], B[1], u))},${Math.round(lerp(A[2], B[2], u))})`; }

/* ------------------------------------------------------ clean cel lines */
function tp(pts, closed = true, begin = true) {
  const n = pts.length;
  if (begin) g.beginPath();
  if (closed) {
    g.moveTo((pts[n - 1][0] + pts[0][0]) / 2, (pts[n - 1][1] + pts[0][1]) / 2);
    for (let i = 0; i < n; i++) { const p = pts[i], q = pts[(i + 1) % n]; g.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }
    g.closePath();
  } else {
    g.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < n - 1; i++) { const p = pts[i], q = pts[i + 1]; g.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }
    g.lineTo(pts[n - 1][0], pts[n - 1][1]);
  }
}
const off = (pts, dx, dy) => pts.map(p => [p[0] + dx, p[1] + dy]);
function bbox(pts) { let a = 1e9, b = 1e9, c = -1e9, d = -1e9; for (const p of pts) { a = Math.min(a, p[0]); b = Math.min(b, p[1]); c = Math.max(c, p[0]); d = Math.max(d, p[1]); } return [a, b, c, d]; }
function fillP(pts, col) { tp(pts); g.fillStyle = col; g.fill(); }
function strokeP(pts, col, lw, closed = true) { g.save(); g.strokeStyle = col; g.lineWidth = lw; g.lineCap = g.lineJoin = 'round'; tp(pts, closed); g.stroke(); g.restore(); }
// base colour, a shadow crescent away from the light, a thin rim-light toward it, then the ink line
function cel(pts, o) {
  const b = bbox(pts), lx = o.lx ?? -6, ly = o.ly ?? -7;
  g.save(); tp(pts); g.clip();
  g.fillStyle = o.base; g.fillRect(b[0] - 4, b[1] - 4, b[2] - b[0] + 8, b[3] - b[1] + 8);
  if (o.shade) { g.beginPath(); tp(pts, true, false); tp(off(pts, lx, ly), true, false); g.fillStyle = o.shade; g.fill('evenodd'); }
  if (o.hi) { const hs = o.hs ?? .35; g.beginPath(); tp(pts, true, false); tp(off(pts, -lx * hs, -ly * hs), true, false); g.fillStyle = o.hi; g.fill('evenodd'); }
  if (o.inner) o.inner();
  g.restore();
  if (o.line !== null) { g.save(); g.strokeStyle = o.line || LINE; g.lineWidth = o.lw ?? 2.2; g.lineJoin = g.lineCap = 'round'; tp(pts); g.stroke(); g.restore(); }
}
function circ(cx, cy, rx, ry = rx, n = 16, rot = 0) { const p = []; for (let i = 0; i < n; i++) { const a = rot + i / n * TAU; p.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); } return p; }
function rrect(x, y, w, h, r, n = 3) {
  const pts = [], c = [[x + w - r, y + r, -Math.PI / 2], [x + w - r, y + h - r, 0], [x + r, y + h - r, Math.PI / 2], [x + r, y + r, Math.PI]];
  for (const [cx, cy, a0] of c) for (let i = 0; i <= n; i++) { const a = a0 + i / n * Math.PI / 2; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return pts;
}
function ribbon(c, w0, w1) {
  const L = [], R = [], n = c.length;
  for (let i = 0; i < n; i++) {
    const a = c[Math.max(0, i - 1)], b = c[Math.min(n - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    const w = lerp(w0, w1, i / (n - 1)) / 2;
    L.push([c[i][0] - dy * w, c[i][1] + dx * w]); R.push([c[i][0] + dy * w, c[i][1] - dx * w]);
  }
  return L.concat(R.reverse());
}
function dot(x, y, r, col) { if (col) g.fillStyle = col; g.beginPath(); g.arc(x, y, Math.max(0, r), 0, TAU); g.fill(); }
function glow(x, y, r, col, a = 1) {
  if (r <= 0 || a <= 0) return;
  const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.save(); g.globalAlpha *= a; g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r); g.restore();
}
function glowL(x, y, r, col, a = 1) { g.save(); g.globalCompositeOperation = 'lighter'; glow(x, y, r, col, a); g.restore(); }
function vgrad(stops, y0 = -20, y1 = H + 20) {
  const gr = g.createLinearGradient(0, y0, 0, y1);
  stops.forEach((c, i) => gr.addColorStop(i / (stops.length - 1), c));
  g.fillStyle = gr; g.fillRect(-60, y0, W + 120, y1 - y0);
}
function sparkle(x, y, r, col = '#fffbe8', a = 1) {
  if (a <= 0) return;
  g.save(); g.globalAlpha *= a; g.fillStyle = col; g.beginPath();
  g.moveTo(x, y - r); g.quadraticCurveTo(x, y, x + r, y); g.quadraticCurveTo(x, y, x, y + r); g.quadraticCurveTo(x, y, x - r, y); g.quadraticCurveTo(x, y, x, y - r);
  g.fill(); g.restore();
}
function txt(s, x, y, size, col, alpha = 1, font = 'hand', reveal = 1) {
  if (alpha <= 0) return;
  g.save();
  g.font = font === 'title' ? `italic 600 ${size}px 'Cormorant Garamond',Georgia,serif` : `600 ${size}px 'Klee One','Caveat',cursive`;
  g.textBaseline = 'middle';
  g.shadowColor = 'rgba(15,20,50,.5)'; g.shadowBlur = size * .22; g.shadowOffsetY = 2;
  const total = g.measureText(s).width;
  let cx = x - total / 2;
  const shown = reveal * s.length;
  for (let i = 0; i < s.length; i++) {
    const w = g.measureText(s[i]).width, la = clamp((shown - i) * 1.2);
    if (la > 0) { g.globalAlpha = alpha * la; g.fillStyle = col; g.fillText(s[i], cx, y + (1 - eo(la)) * 12); }
    cx += w;
  }
  g.restore();
}

/* ------------------------------------------------------------- skies */
const STARS = [...Array(230)].map((_, i) => ({ x: fr(Math.sin(i * 12.99) * 43758) * W, y: fr(Math.sin(i * 78.23) * 23421) * H, r: .5 + fr(Math.sin(i * 3.7) * 9999) * 1.7, ph: fr(Math.sin(i * 5.1) * 777) * TAU }));
function stars(a = 1, shift = 0) {
  g.save(); g.fillStyle = '#fff8e8';
  for (const s of STARS) {
    const x = ((s.x - shift * s.r) % W + W) % W, tw = .55 + .45 * Math.sin(TT * 2.2 + s.ph);
    g.globalAlpha = a * tw; g.beginPath(); g.arc(x, s.y, s.r * .75, 0, TAU); g.fill();
    if (s.r > 1.95) sparkle(x, s.y, s.r * 3.4, '#fff8e8', tw * .8);
  }
  g.restore();
}
const PUFFS = {};
function puffs(seed) {
  if (PUFFS[seed]) return PUFFS[seed];
  const P = [];
  for (let i = -4; i <= 4; i++) P.push([i * .22, -.08, .2 + .04 * Math.abs(sn(seed + i + 50))]);
  for (let i = 0; i < 11; i++) {
    const u = i / 10, x = (u - .5) * 2, top = 1 - x * x, r = .26 + .2 * top + .06 * sn(seed + i);
    P.push([x * .95, -r * .55 - top * .42 + .05 * sn(seed + i + 3), r]);
  }
  for (let i = 0; i < 5; i++) P.push([sn(seed + 20 + i) * .45, -.72 - .3 * Math.abs(sn(seed + 30 + i)), .26 + .1 * Math.abs(sn(seed + 40 + i))]);
  return PUFFS[seed] = P;
}
const CL_DAY = ['#a9bddd', '#f3f6fb', '#ffffff'];
const CL_SUNSET = ['#9a7ea9', '#f7b89b', '#ffe6c8'];
const CL_GOLD = ['#b3a6c4', '#fff0dc', '#fffdf6'];
const CL_DUSK = ['#8f96c6', '#e9ecf8', '#ffffff'];
const CANOPY = ['#2d5b39', '#4d8e45', '#93c55c'];
function cloud(x, y, s, seed, pal = CL_DAY, o = {}) {
  const P = puffs(seed);
  g.save(); g.translate(x, y); g.scale(s * (o.sx || 1), s);
  if (o.a != null) g.globalAlpha *= o.a;
  if (o.flat !== false) { g.beginPath(); g.rect(-6, -6, 12, 6.06); g.clip(); }
  const layer = (col, dx, dy, k, Q) => { g.fillStyle = col; g.beginPath(); for (const p of Q) { g.moveTo(p[0] + dx + p[2] * k, p[1] + dy); g.arc(p[0] + dx, p[1] + dy, p[2] * k, 0, TAU); } g.fill(); };
  layer(pal[0], 0, 0, 1, P);
  layer(pal[1], -.05, -.09, .92, P.slice(9));
  layer(pal[2], -.09, -.15, .62, P.slice(9).filter(p => p[1] < -.5));
  g.restore();
}
function wisp(x, y, w, h, col, a) { g.save(); g.globalAlpha *= a; g.fillStyle = col; g.beginPath(); g.ellipse(x, y, w, h, 0, 0, TAU); g.fill(); g.beginPath(); g.ellipse(x + w * .4, y - h * .6, w * .6, h * .8, 0, 0, TAU); g.fill(); g.restore(); }

/* ------------------------------------------------------------ planets */
const DAMASCUS = { c1: '#9fe0ea', c2: '#2f8ab8', c3: '#15457a', cloud: 'rgba(255,255,255,.75)', atmo: 'rgba(140,220,255,.4)', shade: 'rgba(6,12,40,.88)', rim: 'rgba(200,245,255,.9)' };
const NOD = { c1: '#f6f2fb', c2: '#c4b8e0', c3: '#7c6ea8', cloud: 'rgba(255,255,255,.55)', atmo: 'rgba(225,205,255,.35)', shade: 'rgba(10,8,34,.88)', rim: 'rgba(245,235,255,.9)' };
function gplanet(cx, cy, r, P, spin = 0, o = {}) {
  glow(cx, cy, r * 1.32, P.atmo);
  g.save(); g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.clip();
  const gr = g.createRadialGradient(cx - r * .35, cy - r * .4, r * .05, cx, cy, r * 1.05);
  gr.addColorStop(0, P.c1); gr.addColorStop(.55, P.c2); gr.addColorStop(1, P.c3);
  g.fillStyle = gr; g.fillRect(cx - r, cy - r, 2 * r, 2 * r);
  g.fillStyle = P.cloud;
  for (let i = 0; i < 11; i++) {
    const yy = cy + sn(i * 3.1) * .9 * r, rw = Math.sqrt(Math.max(0, 1 - ((yy - cy) / r) ** 2));
    const xx = cx + (fr(i * .37 + spin * .02 + .5 * sn(i + 7)) * 2.6 - 1.3) * r;
    g.beginPath(); g.ellipse(xx, yy, r * (.22 + .16 * Math.abs(sn(i + 2))) * rw + 1, r * (.028 + .02 * Math.abs(sn(i + 9))) + .5, sn(i) * .12, 0, TAU); g.fill();
  }
  if (o.extra) o.extra();
  const sh = g.createRadialGradient(cx - r * .45, cy - r * .45, r * .2, cx - r * .2, cy - r * .2, r * 1.5);
  sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(.58, 'rgba(0,0,0,0)'); sh.addColorStop(1, P.shade);
  g.fillStyle = sh; g.fillRect(cx - r, cy - r, 2 * r, 2 * r);
  g.restore();
  g.save(); g.strokeStyle = P.rim; g.lineWidth = Math.max(1.5, r * .022); g.globalAlpha *= .85;
  g.beginPath(); g.arc(cx, cy, r - g.lineWidth / 2, Math.PI * .92, Math.PI * 1.72); g.stroke(); g.restore();
}

/* ------------------------------------------------------------ water */
function wavePts(y0, amp = 4, sp = 1) { const P = []; for (let x = -60; x <= W + 60; x += 20) P.push([x, y0 + Math.sin(x * .018 + TT * 1.8 * sp) * amp + Math.sin(x * .047 - TT * 2.6 * sp) * amp * .45]); return P; }
function waterBody(y0, y1, stops, amp = 4) {
  const P = wavePts(y0, amp), Q = P.concat([[W + 60, y1], [-60, y1]]);
  g.beginPath(); Q.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath();
  const gr = g.createLinearGradient(0, y0, 0, y1); stops.forEach((c, i) => gr.addColorStop(i / (stops.length - 1), c));
  g.fillStyle = gr; g.fill();
  return P;
}
function foam(P, col = 'rgba(255,255,255,.85)', lw = 3) { g.save(); g.strokeStyle = col; g.lineWidth = lw; g.lineCap = 'round'; g.beginPath(); P.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke(); g.restore(); }
function rays(y0, y1, n, col, seed = 0) {
  g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = col;
  for (let i = 0; i < n; i++) {
    const x = (i + .5) / n * W + Math.sin(TT * .4 + i * 1.7 + seed) * 30, w = 26 + 22 * Math.abs(sn(i + seed));
    g.beginPath(); g.moveTo(x - w, y0); g.lineTo(x + w, y0); g.lineTo(x + w * 2.4 + 110, y1); g.lineTo(x - w * .4 + 110, y1); g.fill();
  }
  g.restore();
}
function bubble(x, y, r, a = 1) {
  g.save(); g.globalAlpha *= a; g.strokeStyle = 'rgba(225,250,255,.75)'; g.lineWidth = Math.max(1, r * .18);
  g.beginPath(); g.arc(x, y, r, 0, TAU); g.stroke();
  g.fillStyle = 'rgba(255,255,255,.85)'; g.beginPath(); g.arc(x - r * .35, y - r * .35, r * .28, 0, TAU); g.fill(); g.restore();
}
function kelp(x, base, h, seed, col = '#3f8a5a', sh = '#2a6444') {
  const n = 10, c = [];
  for (let j = 0; j <= n; j++) { const u = j / n; c.push([x + Math.sin(TT * 1.1 + seed + u * 3) * 20 * u + sn(seed) * 14 * u, base - u * h]); }
  cel(ribbon(c, 13, 4), { base: col, shade: sh, lx: -3, ly: 0, lw: 1.8 });
  for (let j = 2; j < n; j += 2) { const p = c[j], sd = j % 4 ? 1 : -1; cel(circ(p[0] + sd * 12, p[1] - 6, 13, 5, 10, sd * -.6), { base: col, shade: sh, lx: -2, ly: -1, lw: 1.5 }); }
}
function fish(x, y, s, ang, col = '#dfe8ef') {
  g.save(); g.translate(x, y); g.rotate(ang); g.scale(s, s);
  g.fillStyle = col; g.beginPath(); g.ellipse(0, 0, 10, 4, 0, 0, TAU); g.fill();
  g.beginPath(); g.moveTo(-8, 0); g.lineTo(-15, -5 + Math.sin(TT * 14 + x) * 1.5); g.lineTo(-15, 5 + Math.sin(TT * 14 + x) * 1.5); g.fill();
  g.fillStyle = '#1b2230'; dot(5, -1, 1.1); g.restore();
}

/* -------------------------------------------------------- land & plants */
function grass(yf, x0, x1, n, h, cols, wind, seed, sway = 1) {
  cols.forEach((col, c) => {
    g.beginPath();
    for (let i = c; i < n; i += cols.length) {
      const x = x0 + (i + .5 + .5 * sn(seed + i)) / n * (x1 - x0), y = yf(x) + Math.abs(sn(seed + i * 1.7)) * 6;
      const hh = h * (.55 + .45 * Math.abs(sn(seed + i * 2.1))), sw = wind(x) * hh * sway + sn(seed + i * 3) * hh * .15;
      g.moveTo(x - 2.5, y); g.quadraticCurveTo(x + sw * .3, y - hh * .6, x + sw, y - hh); g.quadraticCurveTo(x + sw * .3 + 2, y - hh * .55, x + 2.5, y);
    }
    g.fillStyle = col; g.fill();
  });
}
function flower(x, y, r, col = '#fff7f0', mid = '#f6c945', rot = 0) {
  g.save(); g.translate(x, y); g.rotate(rot); g.fillStyle = col;
  for (let i = 0; i < 5; i++) { const a = i / 5 * TAU; g.beginPath(); g.ellipse(Math.cos(a) * r * .55, Math.sin(a) * r * .55, r * .5, r * .32, a, 0, TAU); g.fill(); }
  dot(0, 0, r * .3, mid); g.restore();
}
function petal(x, y, s, a, col = '#ffd6e0') { g.save(); g.translate(x, y); g.rotate(a); g.fillStyle = col; g.beginPath(); g.ellipse(0, 0, 5 * s, 2.6 * s * Math.abs(Math.cos(a * 1.7)) + .6, 0, 0, TAU); g.fill(); g.restore(); }
function leafS(x, y, s, a, col) { g.save(); g.translate(x, y); g.rotate(a); g.scale(s, s * (.4 + .6 * Math.abs(Math.sin(a * 1.3)))); g.fillStyle = col; g.beginPath(); g.moveTo(-9, 0); g.quadraticCurveTo(0, -7, 9, 0); g.quadraticCurveTo(0, 7, -9, 0); g.fill(); g.restore(); }
function web(cx, cy, R, build, col, k, rings = 8, n = 14, lw = 1.2) {
  if (build <= 0) return;
  g.save(); g.strokeStyle = col; g.lineWidth = lw; g.lineCap = 'round'; g.beginPath();
  const rl = Math.min(1, build * 2), ang = i => i / n * TAU + sn(k + i) * .08, rad = i => R * (.85 + .15 * Math.abs(sn(k + i + 3)));
  for (let i = 0; i < n; i++) { g.moveTo(cx, cy); g.lineTo(cx + Math.cos(ang(i)) * rad(i) * rl, cy + Math.sin(ang(i)) * rad(i) * rl); }
  for (let j = 1; j <= rings; j++) {
    const vis = clamp((build - .45 - j / rings * .5) * 12);
    if (vis <= 0) continue;
    const f = j / (rings + 1), cnt = Math.ceil(n * vis);
    for (let i = 0; i <= cnt; i++) { const ii = i % n, x = cx + Math.cos(ang(ii)) * rad(ii) * f, y = cy + Math.sin(ang(ii)) * rad(ii) * f; i ? g.lineTo(x, y) : g.moveTo(x, y); }
  }
  g.stroke(); g.restore();
}
function growTree(x, y, ang, len, depth, t0, out, seed, spread = .75) {
  if (depth <= 0) return;
