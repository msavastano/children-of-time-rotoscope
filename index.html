<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Children of Time — a rotoscope minute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#07060d;overflow:hidden;color:#f3e9d2;font-family:'Cormorant Garamond',Georgia,serif}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;box-shadow:0 0 80px rgba(0,0,0,.8);cursor:pointer}
  .ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
      background:radial-gradient(ellipse at center,rgba(20,16,40,.82),rgba(5,4,10,.97));transition:opacity .6s}
  .ov.hide{opacity:0;pointer-events:none}
  .ov h1{font-weight:500;font-style:italic;font-size:clamp(34px,6vw,72px);margin:0;letter-spacing:.02em}
  .ov p{font-family:'Caveat',cursive;font-size:clamp(18px,2.4vw,26px);margin:0;opacity:.7}
  .btn{font-family:'Caveat',cursive;font-size:30px;color:#15121f;background:#f3e9d2;border:none;border-radius:40px;
       padding:10px 38px;cursor:pointer;box-shadow:3px 4px 0 #6fe3a8;transition:transform .15s}
  .btn:hover{transform:translate(-1px,-2px) rotate(-1deg)}
  #bar{position:fixed;left:0;bottom:0;height:3px;background:#6fe3a8;opacity:.55;width:0}
  #hint{position:fixed;right:14px;bottom:10px;font-family:'Caveat',cursive;font-size:17px;opacity:0;transition:opacity 1s}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="bar"></div>
<div id="hint">space · pause &nbsp; r · restart &nbsp; f · fullscreen</div>
<div class="ov" id="start">
  <h1>Children of Time</h1>
  <p>a one-minute rotoscope reverie · sound on</p>
  <button class="btn" id="go">▶ begin</button>
</div>
<div class="ov hide" id="end">
  <p>the web remembers</p>
  <button class="btn" id="again">↻ again</button>
</div>

<script>
/* =====================================================================
   CHILDREN OF TIME — a one-minute rotoscope animation
   Everything is drawn procedurally on canvas with "boiling" hand-drawn
   lines (re-jittered on twos, 12 fps) and all audio is synthesised live
   with the Web Audio API.
   ===================================================================== */

const W = 1280, H = 720, DUR = 60;
const FPS = 24, BOIL = 12;
const INK = '#15121f', CREAM = '#f3e9d2', GLOW = '#6fe3a8';

/* ---------------------------------------------------------------- utils */
let g;          // current drawing context
let BF = 0;     // boil frame
const fr = x => x - Math.floor(x);
const nz = k => fr(Math.sin(k * 127.1 + BF * 311.7) * 43758.5453) * 2 - 1; // boiling noise
const sn = k => fr(Math.sin(k * 91.7 + 3.1) * 47453.3) * 2 - 1;            // static noise
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const eo = t => 1 - Math.pow(1 - t, 3);
const ei = t => t * t * t;
const bell = t => Math.sin(Math.PI * clamp(t));
const TAU = Math.PI * 2;

/* ------------------------------------------------------- hand-drawn core */
function trace(pts, closed, a, key) {
  const n = pts.length, q = new Array(n);
  for (let i = 0; i < n; i++) q[i] = [pts[i][0] + a * nz(key + i * 1.37), pts[i][1] + a * nz(key + i * 1.37 + .71)];
  g.beginPath();
  if (closed) {
    g.moveTo((q[n - 1][0] + q[0][0]) / 2, (q[n - 1][1] + q[0][1]) / 2);
    for (let i = 0; i < n; i++) {
      const p = q[i], nx = q[(i + 1) % n];
      g.quadraticCurveTo(p[0], p[1], (p[0] + nx[0]) / 2, (p[1] + nx[1]) / 2);
    }
    g.closePath();
  } else {
    g.moveTo(q[0][0], q[0][1]);
    for (let i = 1; i < n - 1; i++) {
      const p = q[i], nx = q[i + 1];
      g.quadraticCurveTo(p[0], p[1], (p[0] + nx[0]) / 2, (p[1] + nx[1]) / 2);
    }
    g.lineTo(q[n - 1][0], q[n - 1][1]);
  }
}
function shape(pts, o = {}) {
  const a = o.a ?? 1.4, k = o.k ?? 0, closed = o.closed !== false;
  if (o.fill && closed) {
    g.save();
    const m = o.mis ?? 2.2;
    g.translate(m * nz(k + 3.3), m * nz(k + 4.4));
    trace(pts, true, a * 1.2, k + 20);
    g.fillStyle = o.fill; g.fill();
    g.restore();
  }
  if (o.stroke) {
    g.save();
    g.strokeStyle = o.stroke; g.lineWidth = o.lw ?? 3; g.lineCap = g.lineJoin = 'round';
    trace(pts, closed, a, k); g.stroke();
    if (o.dbl !== false) {
      g.lineWidth = (o.lw ?? 3) * .4; g.globalAlpha *= .65;
      trace(pts, closed, a * 1.9, k + 9.1); g.stroke();
    }
    g.restore();
  }
}
function circ(cx, cy, rx, ry = rx, n = 16, rot = 0) {
  const p = [];
  for (let i = 0; i < n; i++) { const a = rot + i / n * TAU; p.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); }
  return p;
}
function blobPts(cx, cy, r, n, seed, irr = .25, ry = 1) {
  const p = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU, rr = r * (1 + irr * sn(seed + i * 1.9));
    p.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * ry]);
  }
  return p;
}
function rrect(x, y, w, h, r, n = 3) {
  const pts = [], c = [[x + w - r, y + r, -Math.PI / 2], [x + w - r, y + h - r, 0], [x + r, y + h - r, Math.PI / 2], [x + r, y + r, Math.PI]];
  for (const [cx, cy, a0] of c) for (let i = 0; i <= n; i++) { const a = a0 + i / n * Math.PI / 2; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return pts;
}
function line(x1, y1, x2, y2, col, lw, k = 0, a = 1.2, dbl = false) {
  const n = Math.max(2, Math.ceil(Math.hypot(x2 - x1, y2 - y1) / 40) + 1), p = [];
  for (let i = 0; i < n; i++) p.push([lerp(x1, x2, i / (n - 1)), lerp(y1, y2, i / (n - 1))]);
  shape(p, { stroke: col, lw, closed: false, k, a, dbl });
}
function hatch(x, y, w, h, sp, ang, col, lw, k = 0) {
  g.save(); g.strokeStyle = col; g.lineWidth = lw; g.beginPath();
  const c = Math.cos(ang), s = Math.sin(ang), cx = x + w / 2, cy = y + h / 2, R = Math.hypot(w, h) / 2;
  let i = 0;
  for (let d = -R; d <= R; d += sp, i++) {
    const j = nz(k + i * .77) * sp * .3, px = cx - s * (d + j), py = cy + c * (d + j);
    g.moveTo(px - c * R + nz(k + i) * 4, py - s * R); g.lineTo(px + c * R, py + s * R + nz(k + i + .3) * 4);
  }
  g.stroke(); g.restore();
}
function dot(x, y, r, col) { if (col) g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); }
function glow(x, y, r, col, a = 1) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.save(); g.globalAlpha *= a; g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r); g.restore();
}
function vgrad(stops) {
  const gr = g.createLinearGradient(0, 0, 0, H);
  stops.forEach((c, i) => gr.addColorStop(i / (stops.length - 1), c));
  g.fillStyle = gr; g.fillRect(-10, -10, W + 20, H + 20);
}
function txt(s, x, y, size, col, alpha = 1, font = 'Caveat', k = 0, reveal = 1) {
  if (alpha <= 0) return;
  g.save();
  g.font = (font === 'Caveat' ? '600 ' : 'italic 500 ') + size + 'px ' + (font === 'Caveat' ? "'Caveat',cursive" : "'Cormorant Garamond',Georgia,serif");
  g.textBaseline = 'middle';
  const total = g.measureText(s).width;
  let cx = x - total / 2;
  const shown = reveal * s.length;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i], w = g.measureText(ch).width;
    const la = clamp(shown - i);
    if (la > 0) {
      g.globalAlpha = alpha * la;
      g.fillStyle = col;
      g.save();
      g.translate(cx + w / 2 + nz(k + i) * 1.1, y + nz(k + i + .5) * 1.1 + (1 - la) * 8);
      g.rotate(nz(k + i + .9) * .03);
      g.fillText(ch, -w / 2, 0);
      g.restore();
    }
    cx += w;
  }
  g.restore();
}

/* ------------------------------------------------------------ backdrop */
const STARS = [...Array(240)].map((_, i) => ({
  x: fr(Math.sin(i * 12.99) * 43758) * W, y: fr(Math.sin(i * 78.23) * 23421) * H,
  r: .6 + fr(Math.sin(i * 3.7) * 9999) * 1.9, ph: i
}));
function stars(shift = 0, a = 1, col = CREAM) {
  g.save(); g.fillStyle = col; g.strokeStyle = col; g.lineWidth = .9;
  for (const s of STARS) {
    const x = ((s.x - shift * s.r * .6) % W + W) % W;
    g.globalAlpha = a * (.72 + .28 * nz(s.ph * .37));
    g.fillRect(x, s.y, s.r, s.r);
    if (s.r > 2.25) {
      g.beginPath(); g.moveTo(x - 5, s.y + 1); g.lineTo(x + 6, s.y + 1); g.moveTo(x + 1, s.y - 5); g.lineTo(x + 1, s.y + 6); g.stroke();
    }
  }
  g.restore();
}
function bgSpace(c1 = '#0d0a1c', c2 = '#241c48') {
  vgrad([c1, c2]);
  g.save(); g.globalAlpha = .18;
  shape(blobPts(260, 180, 260, 12, 3, .35, .5), { fill: '#5b3f8a', k: 1, a: 4, mis: 5 });
  shape(blobPts(1050, 560, 300, 12, 8, .35, .45), { fill: '#2f5a7a', k: 2, a: 4, mis: 5 });
  g.restore();
}

/* ------------------------------------------------------------- planets */
const LANDS = [[-.6, -.3, .28, 0], [.1, .15, .35, 1], [.55, -.45, .22, 2], [-.2, .55, .25, 3], [.8, .35, .2, 4], [-.95, .2, .18, 5]];
function planet(cx, cy, r, o = {}) {
  const k = o.k || 0;
  if (o.halo) glow(cx, cy, r * 1.3, o.halo);
  const P = circ(cx, cy, r, r, 36);
  shape(P, { fill: o.base, k, a: 1.5 });
  g.save(); g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.clip();
  const rot = o.rot || 0;
  LANDS.forEach((L, i) => {
    const lx = ((L[0] + rot + 1) % 2 + 2) % 2 - 1;
    const x = cx + lx * r * 1.1, y = cy + L[1] * r, rr = L[2] * r;
    shape(blobPts(x, y, rr, 11, L[3] * 13 + k, .3, .75), { fill: o.land, stroke: 'rgba(15,20,25,.45)', lw: 2, k: k + i * 7, a: Math.min(4, rr * .05), dbl: false });
  });
  if (o.ice > 0) {
    const h = o.ice * r * 1.08;
    for (const sd of [-1, 1]) {
      const pts = [];
      for (let i = 0; i <= 12; i++) { const x = cx - r + i / 12 * 2 * r; pts.push([x, cy + sd * (r - h) + Math.sin(i * 1.7 + k) * r * .06]); }
      pts.push([cx + r + 5, cy + sd * (r + 5)], [cx - r - 5, cy + sd * (r + 5)]);
      shape(pts, { fill: '#e9f1f4', stroke: 'rgba(120,150,170,.7)', lw: 1.5, k: k + 40 + sd, dbl: false });
    }
  }
  if (o.extra) o.extra();
  const lx = o.lx ?? -.45, ly = o.ly ?? -.35;
  g.beginPath(); g.rect(cx - r - 5, cy - r - 5, 2 * r + 10, 2 * r + 10);
  g.arc(cx + lx * r * .5, cy + ly * r * .5, r * 1.02, 0, TAU, true);
  g.fillStyle = o.shade || 'rgba(10,8,30,.5)'; g.fill();
  g.save(); g.clip(); hatch(cx - r, cy - r, 2 * r, 2 * r, Math.max(5, r * .04), -.8, 'rgba(10,8,30,.45)', 1.3, k + 2); g.restore();
  g.restore();
  shape(P, { stroke: o.line || INK, lw: o.lw || 3.5, k: k + 1, a: 1.5 });
}
function burst(x, y, R, u, k = 0, c1 = '#fff1a8', c2 = '#ff8a3a') {
  if (u <= 0 || u >= 1) return;
  const s = bell(Math.min(1, u * 1.4)), n = 11;
  const star = (rad, inner) => { const p = []; for (let i = 0; i < n * 2; i++) { const a = i / (n * 2) * TAU + k; const rr = i % 2 ? rad * inner : rad * (.8 + .4 * Math.abs(sn(k + i))); p.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]); } return p; };
  g.save();
  g.globalAlpha = 1 - u * u;
  shape(circ(x, y, R * (.5 + u * 2.2), R * (.5 + u * 2.2), 20), { stroke: c2, lw: 3 * (1 - u), k: k + 5, dbl: false });
  g.globalAlpha = 1;
  shape(star(R * s, .5), { fill: c2, stroke: INK, lw: 2.5, k });
  shape(star(R * s * .55, .55), { fill: c1, k: k + 1 });
  g.restore();
}
function mote(x, y, r, a = 1, col = 'rgba(140,255,190,.9)') {
  glow(x, y, r * 4, col, a * .8);
  g.save(); g.globalAlpha = a; dot(x, y, r * .7, '#eafff2'); g.restore();
}

/* ----------------------------------------------------------- characters */
const PROFILE = [[-0.35, 0.95], [-0.42, 0.55], [-0.52, 0.12], [-0.42, -0.32], [-0.12, -0.56], [0.2, -0.52], [0.4, -0.32], [0.46, -0.1], [0.44, 0.02], [0.6, 0.22], [0.47, 0.3], [0.51, 0.39], [0.46, 0.43], [0.5, 0.49], [0.42, 0.56], [0.44, 0.68], [0.26, 0.8], [0.2, 0.98], [0.24, 1.2], [0.9, 1.38], [1.0, 1.9], [-1.0, 1.9], [-0.8, 1.35], [-0.38, 1.15]];
function profilePts(x, y, s, flip = 1) { return PROFILE.map(p => [x + p[0] * s * flip, y + p[1] * s]); }
function profile(x, y, s, col, o = {}) {
  if (o.bun) shape(circ(x - .5 * s, y - .32 * s, .2 * s, .2 * s, 10), { fill: col, k: 199, dbl: false });
  shape(profilePts(x, y, s, o.flip || 1), { fill: col, stroke: o.line, lw: o.lw || 2, k: 200, a: o.a ?? 1 });
}
function sEye(x, y, r, gl, k) {
  if (gl > 0) glow(x, y, r * 2.6, 'rgba(111,227,168,.8)', gl);
  shape(circ(x, y, r, r, 14), { fill: '#0b0a0d', stroke: INK, lw: 3, k, dbl: false });
  g.save();
  g.strokeStyle = gl > 0 ? `rgba(111,227,168,${.2 + gl * .8})` : 'rgba(150,110,70,.45)';
  g.lineWidth = r * .16; g.beginPath(); g.arc(x, y, r * .66, 0, TAU); g.stroke();
  g.fillStyle = 'rgba(255,250,235,.92)';
  g.beginPath(); g.ellipse(x - r * .33, y - r * .38, r * .24, r * .17, -.5, 0, TAU); g.fill();
  if (gl > .3) { g.fillStyle = `rgba(190,255,220,${gl})`; dot(x + r * .3, y + r * .35, r * .1); }
  g.restore();
}
function portia(x, y, s, o = {}) {
  const gl = o.glow || 0, tw = o.tw || 0;
  g.save(); g.translate(x, y); g.rotate(o.tilt || 0); g.scale(s / 100, s / 100);
  const FUR = '#6e4b33', DARK = '#2e2019', AB = '#5a3d2c', ST = '#c9a36d';
  for (let i = 3; i >= 0; i--) for (const sd of [-1, 1]) {
    const bx = sd * (36 + i * 5), by = 8 + i * 8;
    const kx = sd * (82 + i * 28), ky = -38 + i * 22 + (i === 0 ? Math.sin(tw) * 7 : 0);
    const fx = sd * (108 + i * 40), fy = 72 + i * 8 + (i === 0 ? Math.sin(tw) * 4 : 0);
    const L = [[bx, by], [kx, ky], [(kx + fx) / 2 + sd * 6, (ky + fy) / 2 - 4], [fx, fy]];
    shape(L, { stroke: INK, lw: 16 - i * 1.5, closed: false, k: 100 + i + sd * 10, dbl: false });
    shape(L, { stroke: i % 2 ? DARK : FUR, lw: 10 - i * 1.4, closed: false, k: 100 + i + sd * 10, dbl: false });
    g.save(); g.strokeStyle = ST; g.lineWidth = 1.6; g.beginPath();
    for (let j = 1; j < 6; j++) { const u = j / 6, px = lerp(bx, kx, u), py = lerp(by, ky, u); g.moveTo(px, py); g.lineTo(px + sd * 4 + nz(i + j) * 2, py - 7); }
    g.stroke(); g.restore();
  }
  const A = circ(0, -60, 58, 46, 16);
  shape(A, { fill: AB, stroke: INK, lw: 3, k: 120 });
  g.save(); trace(A, true, 0, 120); g.clip();
  for (let j = 0; j < 3; j++) shape([[-60, -80 + j * 18], [0, -92 + j * 18], [60, -80 + j * 18]], { stroke: ST, lw: 5, closed: false, k: 121 + j, dbl: false });
  g.restore();
  const Hd = rrect(-54, -40, 108, 90, 38);
  shape(Hd, { fill: FUR, stroke: INK, lw: 3.5, k: 122 });
  g.save(); trace(Hd, true, 0, 122); g.clip(); hatch(-54, 18, 108, 40, 6, .9, 'rgba(30,20,15,.4)', 1.2, 123);
  shape(rrect(-40, 24, 80, 20, 10), { fill: 'rgba(230,200,150,.35)', k: 124 });
  g.restore();
  g.save(); g.strokeStyle = ST; g.lineWidth = 2; g.beginPath();
  for (let j = 0; j < 14; j++) { const px = -46 + j * 7; g.moveTo(px, -38); g.lineTo(px + nz(130 + j) * 3, -48 - Math.abs(nz(131 + j)) * 5); }
  g.stroke(); g.restore();
  sEye(-45, -10, 7, gl * .6, 141); sEye(45, -10, 7, gl * .6, 142);
  sEye(-22, 2, 19, gl, 143); sEye(22, 2, 19, gl, 144);
  shape(circ(-13, 46, 10, 14, 10), { fill: ST, stroke: INK, lw: 2.5, k: 150, dbl: false });
  shape(circ(13, 46, 10, 14, 10), { fill: ST, stroke: INK, lw: 2.5, k: 151, dbl: false });
  g.restore();
}
function spiderTop(x, y, s, ang, ph, col = '#1a1216') {
  g.save(); g.translate(x, y); g.rotate(ang); g.scale(s, s);
  g.strokeStyle = col; g.lineWidth = 1.5; g.lineCap = 'round'; g.beginPath();
  for (const sd of [-1, 1]) for (let i = 0; i < 4; i++) {
    const w = Math.sin(ph + i * 1.3 + sd) * 1.8;
    g.moveTo(i * 2.2 - 3, sd * 2); g.lineTo(-7 + i * 5 + w, sd * 9); g.lineTo(-11 + i * 7.5 + w, sd * 14);
  }
  g.stroke();
  g.fillStyle = col; g.beginPath(); g.ellipse(-6, 0, 6, 4.5, 0, 0, TAU); g.fill();
  g.beginPath(); g.ellipse(3, 0, 4, 3.5, 0, 0, TAU); g.fill();
  g.fillStyle = GLOW; dot(6, -1.3, .9); dot(6, 1.3, .9);
  g.restore();
}
function ant(x, y, s, ang, ph, col) {
  g.save(); g.translate(x, y); g.rotate(ang); g.scale(s, s);
  g.strokeStyle = col; g.lineWidth = 1.2; g.beginPath();
  for (const sd of [-1, 1]) for (let i = 0; i < 3; i++) {
    const w = Math.sin(ph + i * 2 + (sd > 0 ? Math.PI : 0)) * 2;
    g.moveTo(i * 2 - 2, 0); g.lineTo(i * 3 - 4 + w, sd * 6);
  }
  g.moveTo(6, 0); g.lineTo(10, -3); g.moveTo(6, 0); g.lineTo(10, 3);
  g.stroke();
  g.fillStyle = col;
  dot(-6, 0, 3.2); dot(0, 0, 2); dot(5, 0, 2.4);
  g.restore();
}
function spiderSide(x, y, s, o = {}) {
  g.save(); g.translate(x, y); g.scale(s / 100 * (o.flip ? -1 : 1), s / 100);
  const C = o.col || INK, k = o.k || 0, rs = o.raise || 0, wv = o.wave || 0;
  const legs = [
    [[-8, -52], [-70, -100], [-125, 0]],
    [[0, -54], [-28, -112], [-52, 0]],
    [[10, -54], [42, -112], [58, 0]],
    [[18, -52], [lerp(82, 70, rs), lerp(-100, -128, rs)], [lerp(122, 118 + Math.sin(wv) * 8, rs), lerp(0, -178 + Math.cos(wv) * 8, rs)]]
  ];
  legs.forEach((L, i) => shape(L, { stroke: C, lw: 8, closed: false, k: k + i, dbl: false, a: 2 }));
  shape(circ(-58, -58, 46, 34, 14), { fill: C, stroke: C, lw: 2, k: k + 10, dbl: false });
  shape(circ(12, -60, 32, 26, 12), { fill: C, stroke: C, lw: 2, k: k + 11, dbl: false });
  if (o.eye) { g.fillStyle = o.eye; dot(36, -62, 5); dot(30, -72, 3); }
  g.restore();

function runner(x, y, s, ph, col) {

function growTree(x, y, ang, len, depth, t0, out, seed, spread = .75) {
  if (depth <= 0) return;

  out.push({ x, y, x2, y2, t0, t1: t0 + .14, d: depth });
  const nb = depth > 3 ? 2 : (sn(seed) > -.2 ? 2 : 1);
  for (let b = 0; b < nb; b++) growTree(x2, y2, ang + (b ? 1 : -1) * spread * (.5 + .5 * Math.abs(sn(seed + b * 3.3))) + sn(seed + 7) * .2, len * .74, depth - 1, t0 + .14, out, seed * 1.7 + b + 1, spread);
